<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--dark:#1a1814;--accent:#c8421a;--gray:#6b6560;--mid-gray:#e0ddd8;--font-display:'Cormorant Garamond',Georgia,serif;--font-body:'Outfit',sans-serif}
body{font-family:var(--font-body);background:#f9f7f4;color:var(--dark);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center}
.logo{font-family:var(--font-display);font-size:2rem;font-weight:700;margin-bottom:3rem;color:var(--dark)}
.logo span{color:var(--accent)}
.err-num{font-family:var(--font-display);font-size:9rem;font-weight:700;color:#e8e4de;line-height:1;margin-bottom:0}
.err-icon{font-size:3rem;margin:-1rem 0 1rem}
h1{font-family:var(--font-display);font-size:2.2rem;font-weight:700;color:var(--dark);margin-bottom:0.75rem}
p{font-size:1rem;color:var(--gray);line-height:1.7;max-width:440px;margin-bottom:2.5rem}
.btn-row{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.btn-primary{background:var(--dark);color:#fff;padding:14px 32px;border-radius:6px;font-weight:600;font-size:0.9rem;border:none;cursor:pointer;font-family:var(--font-body);text-decoration:none;transition:background 0.15s}
.btn-primary:hover{background:var(--accent)}
.btn-outline{background:transparent;color:var(--dark);padding:13px 32px;border-radius:6px;font-weight:600;font-size:0.9rem;border:1.5px solid var(--mid-gray);cursor:pointer;font-family:var(--font-body);text-decoration:none;transition:all 0.15s}
.btn-outline:hover{border-color:var(--dark)}
.help{margin-top:2rem;font-size:0.82rem;color:var(--gray)}
.help a{color:var(--accent);font-weight:600}
</style>
</head>
